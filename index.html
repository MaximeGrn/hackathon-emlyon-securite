<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quand la peur modifie le trajet — Groupe 7b</title>
  <meta name="description" content="Le rapport du Groupe 7b condensé en une carte mentale interactive : comment les femmes de 18 à 34 ans peuvent garder leur liberté de déplacement sans modifier leurs trajets par peur.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/carte.js" defer></script>
  <script src="js/carte.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#panneau">Aller au contenu</a>

  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/favicon.svg" alt="" width="28" height="28">
      <span><strong>Quand la peur modifie le trajet</strong><small>Groupe 7b · Hackathon emlyon 2026</small></span>
    </a>
    <div class="topbar-actions">
      <button type="button" class="pill-toggle" data-overview aria-pressed="false">Vue d’ensemble</button>
      <button type="button" class="text-button" data-reveal-all>Tout afficher</button>
      <button type="button" class="text-button" data-restart>Recommencer</button>
    </div>
  </header>

  <main class="app" data-app>
    <section class="stage" aria-label="Carte mentale du rapport">
      <svg class="map" data-map viewBox="0 0 1500 860" role="group" aria-label="Carte mentale : la problématique au centre, six branches autour"></svg>
      <p class="stage-hint" data-hint>Clique sur une idée de la carte, ou avance avec les flèches du clavier.</p>
    </section>

    <nav class="chips" data-chips aria-label="Branches du rapport"></nav>

    <aside class="panel" id="panneau" tabindex="-1" data-panel></aside>
    <p class="sr-only" aria-live="polite" data-live></p>

    <nav class="outline" data-outline aria-label="Sommaire de la carte" hidden></nav>
  </main>

  <footer class="guide" aria-label="Parcours guidé">
    <button type="button" class="nav-button" data-prev><span aria-hidden="true">←</span> Précédent</button>
    <div class="progress" data-progress role="img"></div>
    <button type="button" class="nav-button primary" data-next>Suivant <span aria-hidden="true">→</span></button>
  </footer>

  <noscript><p class="noscript">Ce site a besoin de JavaScript pour afficher la carte. Le rapport complet reste disponible auprès du Groupe 7b.</p></noscript>
</body>
</html>
